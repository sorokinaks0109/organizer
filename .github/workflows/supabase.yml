# Публикация серверных функций assistant (разбор голоса), speech (распознавание речи) и gcal (Google Календарь) в Supabase.
# Нужны секреты репозитория SUPABASE_ACCESS_TOKEN и SUPABASE_PROJECT_REF (см. README).
name: Сервер Supabase

on:
  push:
    branches: [main]
    paths:
      - supabase/**
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Проверка кода функций
        run: deno check --config supabase/functions/deno.json supabase/functions/assistant/index.ts supabase/functions/speech/index.ts supabase/functions/gcal/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Публикация функций
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Секреты SUPABASE_ACCESS_TOKEN и SUPABASE_PROJECT_REF не заданы — пропускаем публикацию."
            exit 0
          fi
          for f in assistant speech gcal; do
            supabase functions deploy "$f" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          done
