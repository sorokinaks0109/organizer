# Настройки для Supabase CLI (используются при публикации функций через GitHub Actions).
[functions.assistant]
# Проверку входа функции делают сами: так работают и новые, и старые ключи Supabase.
verify_jwt = false

[functions.gcal]
# Google возвращает пользователя на эту функцию без токена входа, поэтому проверка внутри.
verify_jwt = false

[functions.speech]
verify_jwt = false
